# App-local OpenAL Soft overrides (loaded from $APPDIR/bin/alsoft.conf).
# Requesting real-time scheduling fails in containers and on hardened desktops
# ("pthread_setschedparam failed" / "Could not query RTKit"). PulseAudio already
# handles scheduling on the server side, so disable it for the bundled OpenAL.
rt-prio = 0
