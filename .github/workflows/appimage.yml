name: Anylinux-AppImage (ALT / Maleoon910 / UOS20)

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

on:
  # UTC+8 02:30 daily == UTC 18:30 previous day.
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    name: Check ALT Linux p11 for a new Telegram
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      changed: ${{ steps.ver.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Query pkgs.org / ALT mirror for latest version
        id: ver
        run: sh ./tools/check-version.sh

  build:
    name: Build AppImage (aarch64, WebKit2GTK-4.0 only)
    needs: check
    if: needs.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            zstd cpio file python3
      - name: Bootstrap ALT Linux p11 rootfs from frozen snapshot
        run: sudo env REPO_ROOT="$PWD" sh ./get-dependencies.sh
      - name: Build AppImage with EGL shim
        run: |
          sudo env REPO_ROOT="$PWD" ./tools/alt.sh /bin/sh -c 'export LC_ALL=C; /work/make-appimage.sh'
      - name: Collect artifact from chroot build dir
        run: |
          set -e
          mkdir -p dist
          sudo cp -f alt-rootfs/work/dist/*.AppImage* dist/ 2>/dev/null || {
            echo "ERROR: no AppImage produced in chroot build dir" >&2
            ls -la alt-rootfs/work/dist/ 2>/dev/null || true
            exit 1
          }
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Repack deb with the freshly built AppImage
        run: |
          set -e
          # The base deb in assets/ carries the ANGLE shim/ICD/launcher/etc.
          # Replace only /opt/telegram/bin/telegram with this run's AppImage
          # so users can install a single deb and get the latest Telegram.
          ./tools/repack-deb.sh "${{ needs.check.outputs.version }}"
      - name: Verify artifacts
        run: |
          set -e
          ls -lh dist/*.AppImage dist/*.deb
          md5sum shims/libEGL.so.1.1.0
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-aarch64
          path: dist/*

  release:
    name: Publish release
    needs: [check, build]
    if: needs.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/download-artifact@v4
        with:
          name: AppImage-aarch64
          path: dist
      - name: Verify artifacts present
        run: |
          ls -lh dist/*.AppImage
          ls -lh dist/*.deb
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -e
          TAG="v${VERSION}"
          PKGVER=$(printf '%s' "$VERSION" | sed 's/-alt[0-9]*$//')
          DEB="telegram-desktop-hwaccel_${PKGVER}-1_arm64.deb"
          BODY=$(printf '%s\n' \
            "Telegram ${VERSION} for UOS20 / aarch64 (Maleoon 910), built from ALT Linux p11 with WebKit2GTK-4.0 only." \
            "" \
            "Install (single command):" \
            "  sudo dpkg -i ${DEB}" \
            "" \
            "The deb embeds this release's AppImage at /opt/telegram/bin/telegram and ships the ANGLE/Vulkan/Maleoon shim set under /opt/telegram/lib, so no separate AppImage download is needed. Launch Telegram from the application menu or run \`Telegram\`." \
            "A standalone .AppImage is also attached for users who prefer it; it still needs the deb installed for hardware acceleration.")
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; refreshing assets"
            gh release upload "$TAG" dist/*.AppImage dist/*.deb --clobber
          else
            gh release create "$TAG" dist/*.AppImage dist/*.deb \
              --title "Telegram $VERSION (ALT p11 / wk40 / Maleoon910)" \
              --notes "$BODY"
          fi
      - name: Update LATEST_VERSION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -e
          echo "$VERSION" > LATEST_VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST_VERSION
          if git diff --cached --quiet; then
            echo "LATEST_VERSION already current"
          else
            git commit -m "chore: update LATEST_VERSION to $VERSION"
            git push origin HEAD:main
          fi
