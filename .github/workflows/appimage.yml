name: Anylinux-AppImage (ALT / Maleoon910 / UOS20)

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

on:
  # UTC+8 02:30 daily == UTC 18:30 previous day.
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    name: Check ALT Linux p11 for a new Telegram
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      changed: ${{ steps.ver.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Query pkgs.org / ALT mirror for latest version
        id: ver
        run: sh ./tools/check-version.sh

  build:
    name: Build AppImage (aarch64, WebKit2GTK-4.0 only)
    needs: check
    if: needs.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            bubblewrap aria2 curl cpio xz-utils zstd file python3
      - name: Bootstrap ALT Linux p11 rootfs + dependencies
        run: sh ./get-dependencies.sh
      - name: Build AppImage with EGL shim
        run: |
          export REPO_ROOT="$PWD"
          ./tools/alt.sh sh -c 'export LC_ALL=C; /work/make-appimage.sh'
      - name: Verify artifact
        run: |
          set -e
          ls -lh dist/*.AppImage
          md5sum shims/libEGL.so.1.1.0
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-aarch64
          path: dist

  release:
    name: Publish release
    needs: [check, build]
    if: needs.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/download-artifact@v4
        with:
          name: AppImage-aarch64
          path: dist
      - name: Verify artifacts present
        run: |
          ls -lh dist/*.AppImage
          ls -lh assets/*.deb
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -e
          TAG="v${VERSION}"
          BODY="Telegram ${VERSION} AppImage for UOS20 / aarch64 (Maleoon 910).
Built from ALT Linux p11, WebKit2GTK-4.0 only.

Hardware acceleration: install the bundled deb first (it provides the ANGLE
libraries under /opt/telegram/lib that the bundled libEGL shim dlopens):
  sudo dpkg -i ${TAG}/telegram-desktop-hwaccel_7.4.4-1_arm64.deb"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; refreshing assets"
            gh release upload "$TAG" dist/*.AppImage assets/*.deb --clobber
          else
            gh release create "$TAG" dist/*.AppImage assets/*.deb \
              --title "Telegram $VERSION (ALT p11 / wk40 / Maleoon910)" \
              --notes "$BODY"
          fi
      - name: Update LATEST_VERSION
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -e
          echo "$VERSION" > LATEST_VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LATEST_VERSION
          if git diff --cached --quiet; then
            echo "LATEST_VERSION already current"
          else
            git commit -m "chore: update LATEST_VERSION to $VERSION"
            git push origin HEAD:main
          fi
